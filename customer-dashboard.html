
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer Dashboard | Express Delivery Service</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f3f6fa;
      color: #172033;
    }
    main {
      max-width: 750px;
      margin: 20px auto;
      background: white;
      padding: 22px;
      border-radius: 14px;
    }
    h1, h2, h3 { color: #12356b; }
    .card {
      padding: 16px;
      margin: 16px 0;
      background: #eef3fb;
      border-radius: 10px;
      overflow-wrap: anywhere;
    }
    .record {
      background: white;
      border: 1px solid #d5deeb;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
    }
    a, button {
      display: inline-block;
      padding: 12px 16px;
      margin: 6px 4px 6px 0;
      border: 0;
      border-radius: 8px;
      background: #12356b;
      color: white;
      text-decoration: none;
      cursor: pointer;
    }
    #message { overflow-wrap: anywhere; }
    .muted { color: #667085; }
  </style>
</head>
<body>
<main>
  <h1>Express Delivery Service</h1>
  <h2>Customer Dashboard</h2>

  <p id="message">Checking your login...</p>

  <section id="dashboard" hidden>
    <div class="card">
      <strong>Signed in as:</strong>
      <p id="email"></p>
    </div>

    <div class="card">
      <h3>Your delivery requests</h3>
      <div id="orders">Loading requests...</div>
    </div>

    <div class="card">
      <h3>Your shipments</h3>
      <div id="shipments">Loading shipments...</div>
    </div>

    <a href="index.html">Book or track a delivery</a>
    <button id="refresh" type="button">Refresh deliveries</button>
    <button id="signout" type="button">Sign out</button>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL =
  "https://cimupgbvbaiterqwydop.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_upcOjh-2_GZIOpYttWylHg_BWoKW18F";

const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

function showRecords(container, records, makeText) {
  container.replaceChildren();

  if (!records || records.length === 0) {
    container.textContent = "No records linked to this account yet.";
    return;
  }

  records.forEach(record => {
    const item = document.createElement("div");
    item.className = "record";
    item.textContent = makeText(record);
    container.appendChild(item);
  });
}

async function loadDeliveries(user) {
  const ordersBox = document.getElementById("orders");
  const shipmentsBox = document.getElementById("shipments");

  ordersBox.textContent = "Loading delivery requests...";
  shipmentsBox.textContent = "Loading shipments...";

  const { data: orders, error: ordersError } = await client
    .from("delivery_orders")
    .select("tracking_number,status,created_at,pickup_address,delivery_address")
    .eq("customer_id", user.id)
    .order("created_at", { ascending: false });

  if (ordersError) {
    ordersBox.textContent =
      "Could not load requests. Please try again later.";
  } else {
    showRecords(ordersBox, orders, order =>
      "Tracking: " + (order.tracking_number || "Not assigned") +
      " | Status: " + (order.status || "Pending") +
      " | Pickup: " + (order.pickup_address || "Not listed") +
      " | Delivery: " + (order.delivery_address || "Not listed")
    );
  }

  const { data: shipments, error: shipmentsError } = await client
    .from("shipments")
    .select("tracking_number,status,payment_status,created_at,origin,destination")
    .eq("customer_id", user.id)
    .order("created_at", { ascending: false });

  if (shipmentsError) {
    shipmentsBox.textContent =
      "Could not load shipments. Please try again later.";
  } else {
    showRecords(shipmentsBox, shipments, shipment =>
      "Tracking: " + (shipment.tracking_number || "Not assigned") +
      " | Status: " + (shipment.status || "Pending") +
      " | Payment: " + (shipment.payment_status || "Pending") +
      " | From: " + (shipment.origin || "Not listed") +
      " | To: " + (shipment.destination || "Not listed")
    );
  }
}

async function start() {
  const message = document.getElementById("message");
  const { data: { user }, error } = await client.auth.getUser();

  if (error || !user) {
    message.textContent = "Please sign in to view your dashboard.";
    const link = document.createElement("a");
    link.href = "login.html";
    link.textContent = "Go to Login";
    message.appendChild(document.createElement("br"));
    message.appendChild(link);
    return;
  }

  message.textContent = "You are signed in.";
  document.getElementById("email").textContent =
    user.email || "Customer";
  document.getElementById("dashboard").hidden = false;

  await loadDeliveries(user);

  document.getElementById("refresh").onclick = async () => {
    await loadDeliveries(user);
  };
}

document.getElementById("signout").addEventListener("click", async () => {
  await client.auth.signOut();
  window.location.href = "login.html";
});

start();
</script>
</body>
</html>
