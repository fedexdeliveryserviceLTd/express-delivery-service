
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Express Delivery Service — Admin</title>
  <style>
    body{font-family:Arial,sans-serif;max-width:900px;margin:30px auto;padding:16px;background:#f4f6f9;color:#172033}
    h1{color:#123b70}
    .card{background:white;padding:18px;border-radius:12px;margin:16px 0}
    input,button{box-sizing:border-box;width:100%;padding:12px;margin:7px 0;border-radius:7px}
    input{border:1px solid #bbb}
    button{background:#123b70;color:white;border:0;font-weight:bold}
    #message{white-space:pre-wrap}
  </style>
</head>
<body>
  <h1>Express Delivery Service</h1>
  <h2>Admin Dashboard</h2>

  <div class="card">
    <h3>Secure Admin Login</h3>
    <p>Sign in with the account already authorized as an administrator.</p>
    <form id="loginForm">
      <input id="email" type="email" placeholder="Admin email" required>
      <input id="password" type="password" placeholder="Password" required>
      <button type="submit">Sign In</button>
    </form>
    <button id="logout" hidden>Sign Out</button>
    <p id="message">Please sign in to continue.</p>
  </div>

  <div class="card" id="dashboard" hidden>
    <h3>Delivery Orders</h3>
    <p id="orders">Orders will appear here after secure admin access is verified.</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://cimupgbvbaiterqwydop.supabase.co";
    const SUPABASE_KEY = "sb_publishable_upcOjh-2_GZIOpYttWylHg_BWoKW18F";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const message = document.getElementById("message");
    const loginForm = document.getElementById("loginForm");
    const dashboard = document.getElementById("dashboard");
    const logoutButton = document.getElementById("logout");

    function showMessage(text) { message.textContent = text; }

    async function verifyAdmin() {
      dashboard.hidden = true;
      logoutButton.hidden = true;

      try {
        const { data, error } = await db.functions.invoke("admin-check");
        if (error || !data || data.is_admin !== true) {
          showMessage("Admin permission could not be verified. Dashboard access is blocked. Check the admin-check function before continuing.");
          return;
        }

        const { data: orders, error: ordersError } = await db
          .from("delivery_orders")
          .select("*")
          .order("created_at", { ascending: false })
          .limit(50);

        if (ordersError) {
          showMessage("Admin verified, but orders could not be loaded. Check database permissions.");
          return;
        }

        document.getElementById("orders").textContent =
          orders && orders.length
            ? JSON.stringify(orders, null, 2)
            : "No delivery orders found yet.";

        dashboard.hidden = false;
        logoutButton.hidden = false;
        showMessage("Admin access verified.");
      } catch (e) {
        showMessage("Could not verify admin access. Please check the Supabase function setup.");
      }
    }

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      showMessage("Signing in...");
      const { error } = await db.auth.signInWithPassword({
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value
      });

      if (error) {
        showMessage("Sign-in failed: " + error.message);
        return;
      }

      await verifyAdmin();
    });

    logoutButton.addEventListener("click", async () => {
      await db.auth.signOut();
      dashboard.hidden = true;
      logoutButton.hidden = true;
      showMessage("You have signed out.");
    });
  </script>
</body>
</html>
