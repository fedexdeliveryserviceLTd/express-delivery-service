
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password | Express Delivery Service</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f5f8;
      margin: 0;
      padding: 24px;
    }
    main {
      max-width: 400px;
      margin: 50px auto;
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 20px #0001;
    }
    h2 { color: #17365d; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin: 9px 0;
      border-radius: 6px;
      font-size: 16px;
    }
    input { border: 1px solid #bbb; }
    button {
      background: #17365d;
      color: white;
      border: 0;
    }
    #message { overflow-wrap: anywhere; }
  </style>
</head>
<body>
<main>
  <h2>Choose a new password</h2>
  <p>Express Delivery Service</p>
  <form id="resetForm">
    <input id="password" type="password"
      placeholder="New password (at least 8 characters)"
      minlength="8" autocomplete="new-password" required>
    <input id="confirm" type="password"
      placeholder="Confirm new password"
      minlength="8" autocomplete="new-password" required>
    <button type="submit">Update password</button>
  </form>
  <p id="message" role="status"></p>
</main>

<script type="module">
import { createClient } from
  'https://esm.sh/@supabase/supabase-js@2';

const supabase = createClient(
  'https://cimupgbvbaiterqwydop.supabase.co',
  'sb_publishable_upcOjh-2_GZIOpYttWylHg_BWoKW18F'
);

const message = document.getElementById('message');
const form = document.getElementById('resetForm');

const params = new URLSearchParams(location.hash.slice(1));
const token = params.get('access_token');
const refresh = params.get('refresh_token');
const type = params.get('type');
const authError = params.get('error_description');

form.hidden = true;

async function prepare() {
  if (authError) throw new Error(authError);

  if (token && refresh && type === 'recovery') {
    const { error } = await supabase.auth.setSession({
      access_token: token,
      refresh_token: refresh
    });
    if (error) throw error;
  }

  const { data } = await supabase.auth.getSession();

  if (!data.session) {
    throw new Error(
      'No recovery session found. Request a fresh password reset email.'
    );
  }

  form.hidden = false;
  message.textContent = 'Enter and confirm your new password.';
}

prepare().catch(error => {
  message.textContent = error.message;
});

form.addEventListener('submit', async event => {
  event.preventDefault();

  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirm').value;

  if (password !== confirm) {
    message.textContent = 'The passwords do not match.';
    return;
  }

  const { error } = await supabase.auth.updateUser({ password });

  if (error) {
    message.textContent = error.message;
    return;
  }

  await supabase.auth.signOut();
  message.textContent =
    'Password updated! You can now return to the login page and sign in.';
  form.hidden = true;
});
</script>
</body>
</html>
