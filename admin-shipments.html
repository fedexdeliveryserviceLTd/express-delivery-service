
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shipment & Payments | Express Delivery Service</title>
<style>
body{font-family:Arial,sans-serif;background:#f1f5f9;color:#172033;margin:0;padding:16px}
main{max-width:900px;margin:auto}
.card{background:white;padding:16px;margin:12px 0;border-radius:12px;overflow-wrap:anywhere}
input,select,button{font:inherit;padding:11px;margin:5px 4px 5px 0;max-width:100%;border:1px solid #cbd5e1;border-radius:7px}
button{background:#123b70;color:white;cursor:pointer}
label{display:block;margin-top:10px}
</style>
</head>
<body>
<main>
<h1>Express Delivery Service</h1>
<h2>Shipment & Payment Admin</h2>
<section class="card">
<p id="message">Checking admin access...</p>
<button id="refresh" hidden>Refresh</button>
<button id="logout" hidden>Sign out</button>
</section>

<section class="card">
<h3>Create a shipment</h3>
<label>Delivery order
<select id="order"><option value="">Loading orders...</option></select>
</label>
<label>Payment method
<select id="method">
<option value="bank_transfer">Bank transfer</option>
<option value="cash_on_delivery">Cash on delivery</option>
</select>
</label>
<label>Customer email (optional)
<input id="email" type="email" placeholder="customer@example.com">
</label>
<button id="create">Create shipment</button>
</section>

<h2>Existing shipments</h2>
<div id="shipments"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db = window.supabase.createClient(
  "https://cimupgbvbaiterqwydop.supabase.co",
  "sb_publishable_upcOjh-2_GZIOpYttWylHg_BWoKW18F"
);

const message = document.getElementById("message");
const orderSelect = document.getElementById("order");
const shipmentList = document.getElementById("shipments");

const statuses = [
  "Shipment created", "Pending", "Confirmed", "Picked up",
  "In transit", "Out for delivery", "Delivered", "Cancelled"
];
const paymentStatuses = ["pending", "verified", "failed", "collected"];

async function start() {
  const {data:{session}, error} = await db.auth.getSession();

  if (error || !session) {
    message.textContent = "Please sign in with your administrator account first.";
    return;
  }

  const {data:admin, error:adminError} =
    await db.rpc("is_current_user_admin");

  if (adminError || admin !== true) {
    message.textContent = "This account is not authorized as an administrator.";
    return;
  }

  message.textContent = "Admin access confirmed.";
  document.getElementById("refresh").hidden = false;
  document.getElementById("logout").hidden = false;

  await loadOrders();
  await loadShipments();
}

async function loadOrders() {
  const {data, error} = await db.rpc("admin_list_delivery_orders");

  if (error) {
    message.textContent = "Could not load orders: " + error.message;
    return;
  }

  orderSelect.replaceChildren();

  data.forEach(order => {
    const option = document.createElement("option");
    option.value = order.id;
    option.textContent = "#" + order.id + " | " +
      order.customer_name + " | " + order.tracking_number +
      " | " + order.status;
    orderSelect.appendChild(option);
  });

  if (!data.length) {
    orderSelect.innerHTML = '<option value="">No orders available</option>';
  }
}

document.getElementById("create").onclick = async () => {
  const orderId = Number(orderSelect.value);

  if (!orderId) {
    alert("Choose a delivery order first.");
    return;
  }

  const button = document.getElementById("create");
  button.disabled = true;

  const {data, error} = await db.rpc("admin_create_shipment", {
    p_order_id: orderId,
    p_payment_method: document.getElementById("method").value,
    p_customer_email: document.getElementById("email").value.trim() || null
  });

  button.disabled = false;

  if (error) {
    alert("Shipment creation failed: " + error.message);
    return;
  }

  alert("Shipment created successfully. ID: " + data);
  await loadShipments();
};

async function loadShipments() {
  shipmentList.replaceChildren();

  const {data, error} = await db.rpc("admin_list_shipments");

  if (error) {
    message.textContent = "Could not load shipments: " + error.message;
    return;
  }

  message.textContent = "Admin access confirmed | Shipments: " + data.length;

  if (!data.length) {
    shipmentList.textContent =
      "No shipments yet. Create one from a delivery order above.";
    return;
  }

  data.forEach(shipment => {
    const card = document.createElement("section");
    card.className = "card";

    const heading = document.createElement("h3");
    heading.textContent =
      shipment.customer_name + " — " + shipment.tracking_number;
    card.appendChild(heading);

    const details = document.createElement("p");
    details.style.whiteSpace = "pre-line";
    details.textContent =
      "Pickup: " + shipment.origin +
      "\nDelivery: " + shipment.destination +
      "\nPayment method: " + shipment.payment_method.replaceAll("_", " ") +
      "\nPayment status: " + shipment.payment_status +
      "\nShipment status: " + shipment.status;
    card.appendChild(details);

    const statusLabel = document.createElement("label");
    statusLabel.textContent = "Shipment status";
    const statusSelect = document.createElement("select");

    statuses.forEach(status => {
      const option = document.createElement("option");
      option.value = status;
      option.textContent = status;
      statusSelect.appendChild(option);
    });

    statusSelect.value = shipment.status;
    statusLabel.appendChild(statusSelect);
    card.appendChild(statusLabel);

    const locationInput = document.createElement("input");
    locationInput.placeholder = "Current location (optional)";
    card.appendChild(locationInput);

    const notesInput = document.createElement("input");
    notesInput.placeholder = "Tracking note (optional)";
    card.appendChild(notesInput);

    const saveTracking = document.createElement("button");
    saveTracking.textContent = "Save tracking update";

    saveTracking.onclick = async () => {
      saveTracking.disabled = true;

      const {error} = await db.rpc("admin_update_shipment_status", {
        p_shipment_id: shipment.id,
        p_status: statusSelect.value,
        p_location: locationInput.value.trim() || null,
        p_notes: notesInput.value.trim() || null
      });

      saveTracking.disabled = false;

      if (error) {
        alert("Tracking update failed: " + error.message);
        return;
      }

      alert("Tracking update saved.");
      await loadShipments();
    };

    card.appendChild(saveTracking);

    const paymentLabel = document.createElement("label");
    paymentLabel.textContent = "Payment status";
    const paymentSelect = document.createElement("select");

    paymentStatuses.forEach(status => {
      const option = document.createElement("option");
      option.value = status;
      option.textContent = status;
      paymentSelect.appendChild(option);
    });

    paymentSelect.value = shipment.payment_status;
    paymentLabel.appendChild(paymentSelect);
    card.appendChild(paymentLabel);

    const paymentNote = document.createElement("input");
    paymentNote.placeholder = "Transfer reference or collection note";
    card.appendChild(paymentNote);

    const savePayment = document.createElement("button");
    savePayment.textContent = "Save payment update";

    savePayment.onclick = async () => {
      const nextStatus = paymentSelect.value;

      if (nextStatus === "verified" &&
          !confirm("Have you checked your bank account and confirmed receipt?")) {
        return;
      }

      if (nextStatus === "collected" &&
          !confirm("Has the cash actually been collected at delivery?")) {
        return;
      }

      if (nextStatus === "failed" &&
          !confirm("Have you confirmed that this payment failed?")) {
        return;
      }

      savePayment.disabled = true;

      const {error} = await db.rpc("admin_update_shipment_payment", {
        p_shipment_id: shipment.id,
        p_payment_status: nextStatus,
        p_note: paymentNote.value.trim() || null
      });

      savePayment.disabled = false;

      if (error) {
        alert("Payment update failed: " + error.message);
        return;
      }

      alert("Payment update saved to history.");
      await loadShipments();
    };

    card.appendChild(savePayment);

    const historyButton = document.createElement("button");
    historyButton.textContent = "View payment history";

    historyButton.onclick = async () => {
      const {data, error} = await db.rpc("admin_list_payment_history", {
        p_shipment_id: shipment.id
      });

      if (error) {
        alert("History error: " + error.message);
        return;
      }

      alert(data.length
        ? data.map(item =>
            new Date(item.created_at).toLocaleString() + " — " +
            (item.old_status || "new") + " → " + item.new_status +
            "\n" + (item.note || "No note")
          ).join("\n\n")
        : "No payment changes recorded yet.");
    };

    card.appendChild(historyButton);
    shipmentList.appendChild(card);
  });
}

document.getElementById("refresh").onclick = async () => {
  await loadOrders();
  await loadShipments();
};

document.getElementById("logout").onclick = async () => {
  await db.auth.signOut();
  location.href = "login.html";
};

start();
</script>
</body>
</html>
